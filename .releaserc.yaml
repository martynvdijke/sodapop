plugins:
  - [
      "@semantic-release/commit-analyzer",
      {
        "releaseRules": [
          { "type": "chore", "scope": "deps", "release": "patch" },
          { "type": "chore", "scope": "dependencies", "release": "patch" },
          { "type": "refactor", "release": "patch" },
          { "type": "style", "release": "patch" }
        ]
      }
    ]
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - [
      "@semantic-release/exec",
      {
        "prepareCmd": "npm version ${nextRelease.version} --no-git-tag-version --allow-same-version --ignore-scripts && sed -i -E \"s/^version: .*/version: ${nextRelease.version}+1/\" mobile/pubspec.yaml"
      }
    ]
  - [
      "@semantic-release/git",
      {
        "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
        "assets": ["CHANGELOG.md", "package.json", "package-lock.json", "mobile/pubspec.yaml"]
      }
    ]
  - "@semantic-release/github"

branches:
  - main
