version: '3'

vars:
  BIN: bin/sodapop
  DB: data/sodapop.db
  VERSION:
    sh: node -p "require('./package.json').version"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  generate:
    desc: Regenerate Ent ORM code
    cmds:
      - go generate ./ent

  web-build:
    desc: Typecheck and build the TypeScript PWA assets
    cmds:
      - npm run typecheck
      - npm run build

  build:
    desc: Build the server binary
    deps: [web-build]
    cmds:
      - go build -trimpath -ldflags "-X main.Version={{.VERSION}}" -o {{.BIN}} ./cmd/server

  run:
    desc: Run the dev server
    dotenv: ['.env']
    cmds:
      - go run -ldflags "-X main.Version={{.VERSION}}" ./cmd/server

  seed:
    desc: Seed styles, flavours, badges and demo drinks
    cmds:
      - go run ./cmd/seed

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w ./cmd ./internal ./ent

  e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - npx playwright test

  ci:
    desc: Everything CI runs
    cmds:
      - task fmt
      - task vet
      - task web-build
      - task test
      - task e2e

  mobile-analyze:
    desc: Analyze the Flutter Android app
    dir: mobile
    cmds:
      - flutter analyze

  mobile-test:
    desc: Run Flutter tests
    dir: mobile
    cmds:
      - flutter test

  mobile-emulator-test:
    desc: Run the scanner flow on a booted Android emulator
    dir: mobile
    cmds:
      - flutter test integration_test/scanner_test.dart -d emulator-5554 --dart-define=E2E_BASE_URL=http://10.0.2.2:8097

  mobile-apk:
    desc: Build a release APK
    dir: mobile
    cmds:
      - flutter build apk --release
