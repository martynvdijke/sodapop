<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sodapop — Scan. Rate. Repeat.</title>
  <desc id="desc">A cream and lime screen-print poster for Sodapop. Three soda cans sit in front of a lime sunburst. The front can's barcode is caught in a glowing scanner beam. The Sodapop wordmark, with its lime dot, sits above.</desc>

  <defs>
    <path id="canBodyPath" d="M50 110 C50 80 100 66 200 66 C300 66 350 80 350 110 L350 780 C350 812 300 826 200 826 C100 826 50 812 50 780 Z"/>
    <clipPath id="bodyClip"><use href="#canBodyPath"/></clipPath>

    <linearGradient id="canShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".40"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#000000" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>

    <linearGradient id="lidMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3E2"/>
      <stop offset=".55" stop-color="#D7E0C4"/>
      <stop offset="1" stop-color="#BCC9A6"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4E32C" stop-opacity="0"/>
      <stop offset=".16" stop-color="#B4E32C" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#E7FF9E" stop-opacity="1"/>
      <stop offset=".84" stop-color="#B4E32C" stop-opacity=".92"/>
      <stop offset="1" stop-color="#B4E32C" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="beamGlow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
    </filter>

    <linearGradient id="rayFadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".74" stop-color="#ffffff"/>
      <stop offset=".87" stop-color="#000000"/>
    </linearGradient>
    <mask id="rayFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1600">
      <rect width="1600" height="1600" fill="url(#rayFadeGrad)"/>
    </mask>

    <g id="shell">
      <use href="#canBodyPath" fill="var(--body)"/>
      <rect x="50" y="66" width="300" height="760" fill="url(#canShade)" clip-path="url(#bodyClip)"/>
      <ellipse cx="200" cy="104" rx="150" ry="38" fill="url(#lidMetal)" stroke="#16241A" stroke-width="7"/>
      <ellipse cx="200" cy="104" rx="116" ry="26" fill="#C2CEAD"/>
      <ellipse cx="200" cy="104" rx="116" ry="26" fill="none" stroke="#16241A" stroke-width="4" stroke-opacity=".55"/>
      <circle cx="200" cy="106" r="9" fill="#93A47E" stroke="#16241A" stroke-width="4"/>
      <rect x="168" y="82" width="64" height="20" rx="10" fill="#AAB895" stroke="#16241A" stroke-width="4" transform="rotate(-4 200 92)"/>
      <path d="M78 120 C82 96 122 82 172 79" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity=".65"/>
      <g fill="#ffffff" fill-opacity=".55">
        <ellipse cx="96" cy="232" rx="6" ry="10"/>
        <ellipse cx="118" cy="264" rx="4" ry="7"/>
        <ellipse cx="292" cy="222" rx="6" ry="10"/>
        <ellipse cx="312" cy="262" rx="4" ry="6"/>
        <ellipse cx="88" cy="694" rx="6" ry="10"/>
        <ellipse cx="108" cy="738" rx="4" ry="7"/>
        <ellipse cx="300" cy="670" rx="7" ry="11"/>
        <ellipse cx="318" cy="720" rx="5" ry="8"/>
        <ellipse cx="254" cy="782" rx="4" ry="7"/>
      </g>
      <g fill="#ffffff" fill-opacity=".9">
        <circle cx="94" cy="228" r="1.8"/>
        <circle cx="290" cy="218" r="1.8"/>
        <circle cx="298" cy="666" r="2"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1600" fill="#F2F4E6"/>

  <!-- sunburst -->
  <g transform="translate(800 1120)" fill="#E1EBBF" mask="url(#rayFade)">
    <path id="ray" d="M0 0 L-54 -617.6 A620 620 0 0 1 54 -617.6 Z"/>
    <use href="#ray" transform="rotate(30)"/>
    <use href="#ray" transform="rotate(60)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(120)"/>
    <use href="#ray" transform="rotate(150)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(210)"/>
    <use href="#ray" transform="rotate(240)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(300)"/>
    <use href="#ray" transform="rotate(330)"/>
  </g>

  <!-- shadows -->
  <g fill="#16241A" opacity=".13" filter="url(#softShadow)">
    <ellipse cx="480" cy="1290" rx="190" ry="34"/>
    <ellipse cx="1130" cy="1310" rx="200" ry="36"/>
    <ellipse cx="800" cy="1352" rx="245" ry="42"/>
  </g>

  <!-- left can -->
  <g transform="translate(480 920) rotate(-13) scale(.9) translate(-200 -450)">
    <use href="#shell" style="--body:#E85D26"/>
    <rect x="50" y="330" width="300" height="230" fill="#16241A"/>
    <circle cx="132" cy="436" r="11" fill="#B4E32C"/>
    <text x="152" y="450" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="800" font-size="34" letter-spacing="-1" fill="#B4E32C">Sodapop</text>
  </g>

  <!-- right can -->
  <g transform="translate(1130 940) rotate(10) scale(.95) translate(-200 -450)">
    <use href="#shell" style="--body:#16241A"/>
    <rect x="50" y="330" width="300" height="230" fill="#E85D26"/>
    <circle cx="132" cy="436" r="11" fill="#16241A"/>
    <text x="152" y="450" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="800" font-size="34" letter-spacing="-1" fill="#16241A">Sodapop</text>
  </g>

  <!-- hero can -->
  <g transform="translate(800 925) rotate(-6) scale(1.12) translate(-200 -450)">
    <use href="#shell" style="--body:#B4E32C"/>

    <rect x="62" y="340" width="276" height="286" rx="12" fill="#F2F4E6"/>

    <rect x="56" y="432" width="288" height="92" fill="#B4E32C" opacity=".38" filter="url(#beamGlow)"/>

    <!-- barcode -->
    <g fill="#16241A">
      <rect x="100" y="408" width="6" height="128"/>
      <rect x="110" y="408" width="3" height="128"/>
      <rect x="117" y="408" width="2" height="128"/>
      <rect x="123" y="408" width="7" height="128"/>
      <rect x="134" y="408" width="3" height="128"/>
      <rect x="141" y="408" width="4" height="128"/>
      <rect x="149" y="408" width="2" height="128"/>
      <rect x="155" y="408" width="6" height="128"/>
      <rect x="165" y="408" width="2" height="128"/>
      <rect x="171" y="408" width="3" height="128"/>
      <rect x="178" y="408" width="7" height="128"/>
      <rect x="189" y="408" width="2" height="128"/>
      <rect x="195" y="408" width="4" height="128"/>
      <rect x="203" y="408" width="3" height="128"/>
      <rect x="210" y="408" width="2" height="128"/>
      <rect x="216" y="408" width="6" height="128"/>
      <rect x="226" y="408" width="3" height="128"/>
      <rect x="233" y="408" width="2" height="128"/>
      <rect x="239" y="408" width="5" height="128"/>
      <rect x="248" y="408" width="7" height="128"/>
      <rect x="259" y="408" width="2" height="128"/>
      <rect x="265" y="408" width="4" height="128"/>
      <rect x="273" y="408" width="2" height="128"/>
      <rect x="279" y="408" width="6" height="128"/>
      <rect x="289" y="408" width="3" height="128"/>
      <rect x="296" y="408" width="2" height="128"/>
      <rect x="302" y="408" width="4" height="128"/>
    </g>

    <!-- scanner frame -->
    <g fill="none" stroke="#16241A" stroke-width="5" stroke-linecap="round" stroke-opacity=".85">
      <path d="M88 396 h22 M88 396 v22"/>
      <path d="M312 396 h-22 M312 396 v22"/>
      <path d="M88 548 h22 M88 548 v-22"/>
      <path d="M312 548 h-22 M312 548 v-22"/>
    </g>

    <text x="200" y="578" text-anchor="middle" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="2.5" fill="#16241A" fill-opacity=".7">330 ML · SOFT DRINK</text>

    <!-- scan beam -->
    <g transform="rotate(-2 200 472)">
      <rect x="56" y="464" width="288" height="16" fill="url(#beam)"/>
      <rect x="56" y="471" width="288" height="2" fill="#FFFFFF" opacity=".92"/>
      <g fill="#FFFFFF">
        <circle cx="90" cy="472" r="2.6"/>
        <circle cx="310" cy="472" r="2.6"/>
      </g>
    </g>
  </g>

  <!-- bubbles -->
  <g fill="#FFFFFF" fill-opacity=".45" stroke="#16241A" stroke-opacity=".16" stroke-width="3">
    <circle cx="1188" cy="470" r="26"/>
    <circle cx="1244" cy="542" r="13"/>
    <circle cx="1108" cy="614" r="10"/>
    <circle cx="430" cy="512" r="20"/>
    <circle cx="372" cy="596" r="12"/>
    <circle cx="466" cy="648" r="8"/>
    <circle cx="1180" cy="706" r="9"/>
    <circle cx="300" cy="758" r="13"/>
    <circle cx="1336" cy="556" r="8"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity=".85">
    <path d="M1178 460 a14 14 0 0 1 10 -6"/>
    <path d="M423 504 a11 11 0 0 1 8 -5"/>
    <path d="M295 752 a7 7 0 0 1 5 -4"/>
  </g>

  <!-- wordmark -->
  <circle cx="383" cy="220" r="29" fill="#B4E32C"/>
  <circle cx="383" cy="220" r="41" fill="none" stroke="#B4E32C" stroke-width="3" stroke-opacity=".4"/>
  <text x="437" y="292" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="800" font-size="200" letter-spacing="-6" fill="#16241A">Sodapop</text>

  <text x="800" y="392" text-anchor="middle" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="700" font-size="38" letter-spacing="11" fill="#16241A" fill-opacity=".82">SCAN. RATE. REPEAT.</text>

  <!-- footer -->
  <rect x="736" y="1418" width="128" height="6" rx="3" fill="#B4E32C"/>
  <text x="800" y="1486" text-anchor="middle" font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="500" font-size="29" letter-spacing=".5" fill="#16241A" fill-opacity=".72">A barcode-first check-in community for soft drinks.</text>

  <rect width="1600" height="1600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:multiply"/>
</svg>
