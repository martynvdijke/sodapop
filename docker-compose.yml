services:
  sodapop:
    image: ghcr.io/martynvdijke/sodapop:latest
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.0.0-dev}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8097:8097"
    volumes:
      - sodapop-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

  # Optional local collector. Start with:
  #   docker compose --profile observability up
  # and set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4317:4317"

volumes:
  sodapop-data:
