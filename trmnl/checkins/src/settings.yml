strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
polling_url: "{{url}}/api/v1/trmnl/checkins?limit=10&handle={{handle}}"
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
  - keyname: url
    name: Sodapop address
    field_type: url
    description: The base URL of your Sodapop instance
    placeholder: https://sodapop.vandijke.xyz
    help_text: Please include the protocol (e.g. http or https)
  - keyname: handle
    name: Member handle
    field_type: text
    description: Leave blank for the public feed, or enter a Sodapop handle
    placeholder: ""
    help_text: Leave blank for the public feed, or enter a Sodapop handle. The profile must have a public profile enabled
  - keyname: bio
    name: About This Plugin
    category: entertainment
    field_type: author_bio
    description: Latest public Sodapop pours
    github_url: https://github.com/martynvdijke/sodapop
    learn_more_url: https://github.com/martynvdijke/sodapop
    email_address: martyn@vandijke.xyz
name: Sodapop - Recent Pours
description: Latest public Sodapop pours
refresh_interval: 15
