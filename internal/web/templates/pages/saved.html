{{define "content"}}
<section class="saved-page">
  <header class="saved-head">
    <p class="eyebrow">Kept for later</p>
    <h1>Saved posts</h1>
    <p class="lede">Check-ins you saved, newest first.</p>
  </header>

  {{range .Items}}{{template "feed_item" .}}{{else}}
    <div class="empty">
      <p class="empty-title">No saved posts yet.</p>
      <p>Save a check-in from your feed and it will wait here.</p>
      <p class="empty-actions"><a class="btn btn-primary" href="/drinks">Browse drinks</a></p>
    </div>
  {{end}}

  {{if .HasMore}}
    <nav class="saved-more" aria-label="More saved posts">
      <a class="btn" href="?before={{.NextBefore}}">Older saves</a>
    </nav>
  {{end}}
</section>
{{end}}
