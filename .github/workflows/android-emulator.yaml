name: Android scanner emulator

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-emulator.yaml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-emulator.yaml'

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Scanner integration test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Seed and start Sodapop
        run: |
          rm -f /tmp/sodapop-emulator.db
          DATABASE_PATH=/tmp/sodapop-emulator.db SEED_DEMO=1 go run ./cmd/seed
          DATABASE_PATH=/tmp/sodapop-emulator.db \
            PORT=8097 \
            BASE_URL=http://127.0.0.1:8097 \
            SESSION_SECRET=android-emulator-secret-android-emulator \
            ALLOW_PASSWORD_FALLBACK=true \
            ENV=development \
            nohup go run ./cmd/server >/tmp/sodapop-emulator-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8097/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sodapop-emulator-server.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scanner integration test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            cd mobile
            flutter test integration_test/scanner_test.dart \
              -d emulator-5554 \
              --dart-define=E2E_BASE_URL=http://10.0.2.2:8097

      - name: Upload server log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-server
          path: /tmp/sodapop-emulator-server.log
          if-no-files-found: ignore
          retention-days: 7
