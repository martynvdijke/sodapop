name: Play Store

# Publishes the Android App Bundle that the release workflow built, to Google
# Play. The bundle arrives as a workflow artifact from the same run, so it is
# never rebuilt here. Called by the release workflow after semantic-release has
# published a new version.

on:
  workflow_call:
    inputs:
      version:
        description: Release version to publish (for example 3.14.8)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check Play Store credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - name: Check Android signing and Play Store credentials
        id: credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Play Store credentials are not configured; skipping Play Store publish."
          fi

  publish:
    name: Publish to Google Play
    needs: check
    if: needs.check.outputs.configured == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed App Bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-aab
          path: out

      - name: Upload bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'xyz.vandijke.sodapop' }}
          releaseFiles: out/app-release.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          status: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ inputs.version }}
